name: C5-F4R hosted SAST feasibility trial (Docker network isolation, non-blocking)

# Owner-dispatched trial only. It is not referenced by ci.yml or its `required`
# job, has no push/PR trigger, and its result can never authorize release,
# deployment or C5 acceptance. G2/G5 risks stay open; nothing here waives them.
# C5-F4R: no privilege escalation or host namespace tools. Install and scan run in a digest-pinned Ubuntu 24.04
# container with --network none, uid 1001, all capabilities dropped,
# no-new-privileges and a read-only root (scripts/sast/hosted_trial.py).
# C5-G4H: the TypeScript syntax gate runs on the host with the pinned Node (exact
# apps/octocat-supply/.node-version) and the lock-verified compiler from `npm ci --ignore-scripts`;
# any setup or compiler failure stops the job before an image is built or a container starts.
# The scan image stays Node-free and network-less.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type run-c5-f4-hosted-trial to confirm explicit owner authorization"
        required: true
        type: string
      authorization_reference:
        description: "Owner authorization reference (8-80 chars; letters, digits, space . _ : / -)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c5-f4-hosted-sast-trial
  cancel-in-progress: false

jobs:
  hosted-sast-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require explicit owner confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          AUTH_REF: ${{ inputs.authorization_reference }}
        run: |
          if [ "$CONFIRM" != "run-c5-f4-hosted-trial" ]; then
            echo "::error title=C5-F4 not confirmed::confirmation phrase mismatch; nothing executed"
            exit 2
          fi
          if ! printf '%s' "$AUTH_REF" | grep -Eqx '[A-Za-z0-9._:/ -]{8,80}'; then
            echo "::error title=C5-F4 not authorized::authorization_reference missing or malformed"
            exit 2
          fi
          echo "C5-F4 hosted trial confirmed; non-blocking; no release, deployment or acceptance authority."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record runner facts (read-only)
        env:
          TRIAL_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
        run: python3 -I scripts/sast/hosted_trial.py facts

      - name: Provision pinned Node for the C5-G4 TypeScript gate (exact .node-version)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.2"

      - name: Install the application lockfile (integrity-verified; no lifecycle scripts)
        working-directory: apps/octocat-supply
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        run: npm ci --ignore-scripts

      - name: C5-G4 TypeScript gate preflight (pinned node + lock-verified compiler; stops before any container)
        run: python3 -I scripts/sast/hosted_trial.py typescript-preflight --node "$(command -v node)"

      - name: Download hash-locked Linux wheels (no install, no execution)
        run: |
          python3 -m venv "$RUNNER_TEMP/c5-download"
          "$RUNNER_TEMP/c5-download/bin/python" -m pip download --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: --platform manylinux_2_34_x86_64 --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 --platform manylinux_2_5_x86_64 --platform manylinux1_x86_64 --python-version 3.12 --implementation cp --abi cp312 --abi abi3 --abi none -d "$RUNNER_TEMP/c5-wheels" -r requirements-sast-linux.txt

      - name: Build digest-pinned Ubuntu 24.04 runtime image (signed APT only)
        run: python3 -I scripts/sast/hosted_trial.py container-build --iidfile "$RUNNER_TEMP/c5-image.iid"

      - name: Offline hash-required install in network-less container (pip check fatal)
        run: python3 -I scripts/sast/hosted_trial.py container-install --image-id-file "$RUNNER_TEMP/c5-image.iid" --wheels "$RUNNER_TEMP/c5-wheels" --venv "$RUNNER_TEMP/c5-sast"

      - name: Run hardened harness in network-less container (fails closed; exits 0-7)
        env:
          TRIAL_AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
        run: python3 -I scripts/sast/hosted_trial.py container-run --image-id-file "$RUNNER_TEMP/c5-image.iid" --venv "$RUNNER_TEMP/c5-sast" --repeat 5 --node "$(command -v node)"

      - name: Summarize evidence (reports missing evidence as exit 7)
        if: always()
        run: python3 -I scripts/sast/hosted_trial.py summarize

      - name: Upload allowlisted trial evidence (never raw engine reports)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: c5-f4r-hosted-sast-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/sast/hosted-runner-facts.json
            artifacts/sast/container-image.json
            artifacts/sast/container-install.json
            artifacts/sast/container-run.json
            artifacts/sast/hosted-trial.json
            artifacts/sast/c5-summary.json
          retention-days: 7
          if-no-files-found: warn
