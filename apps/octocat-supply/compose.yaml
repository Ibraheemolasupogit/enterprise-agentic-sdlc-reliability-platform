name: morrow-supply-m2
services:
  api:
    image: morrow-supply-api:m2-local
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: data/demo.sqlite
    volumes:
      - demo-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
  frontend:
    image: morrow-supply-web:m2-local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PORT: ${API_PORT:-3000}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 3
volumes:
  demo-data:
